<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Smart Doorbell — System Architecture</text>

  <!-- DEVICE -->
  <rect x="40" y="40" width="160" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="68" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Device</text>
  <text x="120" y="86" text-anchor="middle" font-size="12" fill="#0F6E56">Raspberry Pi</text>
  <rect x="58" y="104" width="124" height="32" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="124" text-anchor="middle" font-size="12" fill="#085041">Camera Module</text>
  <rect x="58" y="144" width="124" height="32" rx="6" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="120" y="164" text-anchor="middle" font-size="12" fill="#085041">Sense HAT button</text>

  <!-- ARROW Device -> Broker -->
  <line x1="200" y1="120" x2="254" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="227" y="112" text-anchor="middle" font-size="11" fill="#555">MQTT</text>
  <text x="227" y="135" text-anchor="middle" font-size="10" fill="#888">doorcam/events</text>

  <!-- MQTT BROKER -->
  <rect x="256" y="88" width="140" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="326" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#26215C">MQTT Broker</text>
  <text x="326" y="136" text-anchor="middle" font-size="12" fill="#534AB7">Mosquitto (localhost)</text>

  <!-- ARROW Broker -> Backend -->
  <line x1="396" y1="120" x2="450" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="423" y="112" text-anchor="middle" font-size="11" fill="#555">subscribe</text>

  <!-- BACKEND -->
  <rect x="452" y="80" width="180" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="542" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#412402">Backend service</text>
  <text x="542" y="128" text-anchor="middle" font-size="12" fill="#854F0B">app.py — receives events</text>
  <text x="542" y="146" text-anchor="middle" font-size="12" fill="#854F0B">saves + notifies</text>

  <!-- ARROW Backend -> SQLite -->
  <line x1="542" y1="160" x2="542" y2="238" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="558" y="205" font-size="11" fill="#555">write</text>

  <!-- SQLITE -->
  <rect x="452" y="240" width="180" height="64" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="542" y="268" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">SQLite database</text>
  <text x="542" y="288" text-anchor="middle" font-size="12" fill="#5F5E5A">doorcam.db — events</text>

  <!-- ARROW SQLite -> Dashboard -->
  <line x1="452" y1="272" x2="262" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="298" text-anchor="middle" font-size="11" fill="#555">query</text>

  <!-- DASHBOARD -->
  <rect x="40" y="320" width="220" height="100" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="150" y="348" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">Flask dashboard</text>
  <text x="150" y="367" text-anchor="middle" font-size="12" fill="#185FA5">port 5000</text>
  <text x="150" y="385" text-anchor="middle" font-size="12" fill="#185FA5">/api/events  /api/stats</text>
  <text x="150" y="403" text-anchor="middle" font-size="12" fill="#185FA5">auto-refresh every 10s</text>

  <!-- ARROW Backend -> ntfy (dashed) -->
  <line x1="542" y1="160" x2="542" y2="378" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="542" y1="378" x2="634" y2="408" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- NTFY -->
  <rect x="452" y="380" width="180" height="64" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="542" y="408" text-anchor="middle" font-size="14" font-weight="600" fill="#4A1B0C">ntfy notification</text>
  <text x="542" y="428" text-anchor="middle" font-size="12" fill="#993C1D">ntfy.sh/doorcam-roshie</text>

  <!-- Legend -->
  <line x1="40" y1="490" x2="65" y2="490" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="70" y="494" font-size="11" fill="#555">data flow</text>
  <line x1="150" y1="490" x2="175" y2="490" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="180" y="494" font-size="11" fill="#555">notification</text>
</svg>
